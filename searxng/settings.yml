# SearXNG for the Workspace Portal gateway. No API keys, no account.
#
# Every search asks four engines: keenable, yahoo, yandex and metacrawler. keenable returns the
# longest snippets but has no page 2 and no date filter. yahoo and yandex have both and metacrawler
# has page 2, so those searches still find something.
# The four engines marked "disabled" stay loaded but out of ordinary searches: the gateway asks
# them by name (SEARCH_FALLBACK_ENGINES in the portal's .env) when a search finds almost nothing.
use_default_settings:
  engines:
    keep_only: [keenable, yahoo, yandex, metacrawler, duckduckgo, swisscows, privacywall, mojeek]
general:
  debug: false
  instance_name: "Private search"
  enable_metrics: true
  open_metrics: ''
search:
  safe_search: 0
  autocomplete: ""
  favicon_resolver: ""
  default_lang: en-US
  formats: [html, json]
  # An engine that fails sits out for 30 s, up to 5 min if it keeps failing. One that turns us
  # away sits out longer so the block can lapse: 10 min after "access denied" (engines also answer
  # that once in a while for no reason), 30 min after "too many requests", 60 min after a CAPTCHA.
  ban_time_on_fail: 30
  max_ban_time_on_fail: 300
  suspended_times:
    SearxEngineAccessDenied: 600
    SearxEngineCaptcha: 3600
    SearxEngineTooManyRequests: 1800
server:
  base_url: false
  limiter: false
  public_instance: false
  image_proxy: true
  method: POST
valkey:
  url: false
ui:
  query_in_title: false
  results_on_new_tab: true
preferences:
  lock: [autocomplete, favicon_resolver, image_proxy, method, query_in_title]
outgoing:
  # A slow engine is cut off instead of holding up the other three.
  request_timeout: 2.5
  max_request_timeout: 4.0
  useragent_suffix: ""
engines:
  - name: keenable
    disabled: false
    inactive: false
  - name: yahoo
    disabled: false
  - name: yandex
    disabled: false
  - name: metacrawler
    disabled: false
    inactive: false
  - name: duckduckgo
    disabled: true
  - name: swisscows
    disabled: true
    inactive: false
  - name: privacywall
    disabled: true
  - name: mojeek
    disabled: true
    inactive: false
