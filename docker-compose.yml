# Workspace Portal: the web app, the gateway, SearXNG and the page reader. The gateway creates the workspace
# containers itself. Settings come from .env, which deploy/install.sh completes from .env.example and checks against
# this file (what is written with ":?" needs a value); each service is passed only the ones it uses, by name.
name: workspace-portal

x-common: &common
  restart: unless-stopped
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  mem_limit: 512m
  pids_limit: 256
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

x-healthcheck: &healthcheck { interval: 30s, timeout: 5s, retries: 3, start_period: 20s }

# SearXNG and the reader fetch what agents name from the public internet, so they get no volume, no capability,
# no portal secret, and a network each from which container/security/firewall.sh lets them reach only public addresses on ports
# 80 and 443 and their DNS servers. Only the gateway talks to them, through a port on the host's loopback.
x-internet-only: &internet-only
  <<: *common
  read_only: true
  # Not the host's search domains: a failed lookup would send the LAN's name to the public resolvers.
  dns_search: ["."]
  cpus: 1.0

services:
  web:
    <<: *common
    build: { context: ., dockerfile: web/Dockerfile }
    image: workspace-portal/web:latest
    network_mode: host
    # A service account that owns nothing but the database directory.
    user: "10001:10001"
    environment: [
      "HOSTNAME=${WEB_BIND:?}", "PORT=${WEB_PORT:?}", TZ, PORTAL_DATA_DIR, AGENT_PORT_BASE, AGENT_PORT_COUNT,
      CONTROL_PORT, GATEWAY_CONTROL_SECRET, PORTAL_HTTPS, SESSION_TTL_HOURS, IDLE_TIMEOUT_MINUTES,
      ADMIN_USERNAME, ADMIN_PASSWORD, ADMIN_FIRST_NAME, ADMIN_MIDDLE_NAME, ADMIN_LAST_NAME,
    ]
    volumes:
      - ${PORTAL_DATA_DIR:?}/db:${PORTAL_DATA_DIR:?}/db
    depends_on:
      gateway: { condition: service_healthy }
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+process.env.PORT+'/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]

  gateway:
    <<: *common
    build: { context: ., dockerfile: gateway/Dockerfile }
    image: workspace-portal/gateway:latest
    network_mode: host
    # Root with only the file capabilities it needs to create each user's directories and hand them to that
    # workspace's UID. label=disable: SELinux denies the Docker socket to confined containers.
    user: "0:0"
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: ["no-new-privileges:true", "label=disable"]
    read_only: true
    tmpfs: ["/tmp:size=64m"]
    # No ADMIN_* here. SEARXNG_URL and READER_URL are the stack's own services unless .env names others.
    environment: [
      TZ, PORTAL_DATA_DIR, WEB_PORT, PORTAL_HTTPS, AGENT_BIND, AGENT_PORT_BASE, AGENT_PORT_COUNT, CONTROL_PORT, SERVICE_PORT, GATEWAY_CONTROL_SECRET,
      LLM_UPSTREAM_URL, LLM_API_KEY, LLM_MAX_CONCURRENCY, LLM_MAX_CONCURRENCY_PER_USER,
      HOSTD_PORTAL_URL, HOSTD_PORTAL_TOKEN, HOSTD_LLM_URL, HOSTD_LLM_TOKEN, ENGINE_RELEASE_NOTES_REPO, ENGINE_DRAIN_MINUTES,
      "SEARXNG_URL=${SEARXNG_URL:-http://127.0.0.1:${SEARXNG_PORT}}", SEARXNG_AUTHORIZATION, SEARXNG_TIMEOUT_SECONDS,
      SEARCH_MAX_CONCURRENT_PER_USER, SEARCH_FALLBACK_ENGINES, SEARCH_FALLBACK_BELOW, SEARCH_CACHE_MINUTES, EXA_SEARCH,
      "READER_URL=${READER_URL:-http://127.0.0.1:${READER_PORT}}", READER_URL_POLICY, READER_TRUSTED_HOSTS, READER_PAGE_CHARS,
      READER_CACHE_MINUTES, READER_TIMEOUT_SECONDS, READER_MAX_CONCURRENT_PER_USER,
      WORKSPACE_AGENTS, QWEN_CODE_VERSION, DSH_VERSION, OPENCODE_VERSION,
      WORKSPACE_NETWORK, WORKSPACE_SUBNET, WORKSPACE_GATEWAY_IP, WORKSPACE_IP_RANGE, WORKSPACE_BRIDGE, WORKSPACE_UID_BASE,
      ONLINE_WORKSPACES, ONLINE_NETWORK, ONLINE_SUBNET, ONLINE_GATEWAY_IP, ONLINE_IP_RANGE, ONLINE_BRIDGE, ONLINE_DNS_1, ONLINE_DNS_2,
      WORKSPACE_MEMORY, WORKSPACE_CPUS, WORKSPACE_PIDS, WORKSPACE_SHM, WORKSPACE_TMP, WORKSPACE_BROWSER, DEFAULT_REASONING_EFFORT,
      MAX_RUNNING_WORKSPACES, IDLE_TIMEOUT_MINUTES, MAX_BUSY_HOURS, UPLOAD_LIMIT_MB,
    ]
    volumes:
      # Root on the host: only the gateway has it.
      - /var/run/docker.sock:/var/run/docker.sock
      - ${PORTAL_DATA_DIR:?}:${PORTAL_DATA_DIR:?}
      # The build context of agent updates from the admin console.
      - ./container/image:/app/container/image:ro
      - ./harnesses:/app/harnesses:ro
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.CONTROL_PORT||4002)+'/control/health',{headers:{authorization:'Bearer '+process.env.GATEWAY_CONTROL_SECRET}}).then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 15s
      start_period: 15s

  searxng:
    <<: *internet-only
    build: { context: searxng }
    image: workspace-portal/searxng:latest
    # The upstream image's own user: its start script complains about any other.
    user: "977:977"
    # /tmp holds SearXNG's caches. The other two are volumes in the upstream image: a tmpfs keeps Docker from
    # creating volumes that would outlive the container.
    tmpfs:
      - /tmp:size=128m,noexec,nosuid,nodev
      - /etc/searxng:size=1m,uid=977,gid=977,mode=0700,noexec,nosuid,nodev
      - /var/cache/searxng:size=16m,uid=977,gid=977,mode=0700,noexec,nosuid,nodev
    networks: [searxng]
    ports: ["127.0.0.1:${SEARXNG_PORT:?}:8080"]
    dns: ["${SEARXNG_DNS_1:?}", "${SEARXNG_DNS_2:?}"]
    # Never SEARXNG_PORT: the image's start script would listen on it.
    environment:
      # The installer generates the key once the firewall is loaded; SearXNG refuses to start with this example key.
      SEARXNG_SECRET: ${SEARXNG_SECRET:-ultrasecretkey}
      # The image's default is "::", and this network has no IPv6.
      GRANIAN_HOST: 0.0.0.0
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]

  reader:
    <<: *internet-only
    build: { context: reader }
    image: workspace-portal/reader:latest
    user: "10002:10002"
    tmpfs: ["/tmp:size=32m,noexec,nosuid,nodev"]
    networks: [reader]
    ports: ["127.0.0.1:${READER_PORT:?}:8080"]
    dns: ["${READER_DNS_1:?}", "${READER_DNS_2:?}"]
    environment: [READER_FETCH_TIMEOUT_SECONDS, READER_MAX_CONCURRENT, READER_MAX_DOWNLOAD_MB, READER_MAX_PDF_MB, READER_MAX_PDF_PAGES, READER_USER_AGENT]
    pids_limit: 64
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3).status == 200 else 1)"]
      start_period: 15s

networks:
  # Fixed bridge names and subnets: the firewall matches both. One network each, so neither service is on the other's.
  searxng:
    name: workspace-portal-searxng
    driver: bridge
    enable_ipv6: false
    driver_opts: { com.docker.network.bridge.name: "${SEARXNG_BRIDGE:?}", com.docker.network.bridge.enable_icc: "false" }
    ipam: { config: [{ subnet: "${SEARXNG_SUBNET:?}" }] }
  reader:
    name: workspace-portal-reader
    driver: bridge
    enable_ipv6: false
    driver_opts: { com.docker.network.bridge.name: "${READER_BRIDGE:?}", com.docker.network.bridge.enable_icc: "false" }
    ipam: { config: [{ subnet: "${READER_SUBNET:?}" }] }
