# llama-swap on the AI server: one address (port 8080) for the LLM, the image models and the media models,
# which do not fit in memory together. A request names its model; llama-swap starts that model's unit and, when the
# model belongs to an exclusive group, first stops the models of the other groups. The everyday speech models are the
# exception: they start beside whatever runs, the LLM included (group `speech`). It waits for requests in flight to
# finish before it stops a model, and holds new requests while it swaps. A video job runs after the request that
# created it has ended, so llama-swap would stop the video model for the next request; the portal's gateway sends
# none until the job's video is downloaded (gateway/src/service/video-jobs.ts). Goes to
# ~/.config/llama-swap/config.yaml (docs/GUIDE.md).
# Reference: https://github.com/mostlygeek/llama-swap/blob/v277/docs/config.example.yaml

# Covers the LLM's longest load stage (the first start after an update hashes 86 GB, about 72 s). llama-swap also
# gives a model it stops for a swap this long to exit.
healthCheckTimeout: 600
# Time to stop a model on an unload (portal-hostd's engine updates): the LLM writes its cache to disk first.
unloadTimeout: 180
# Requests carry people's prompts: keep no copies of them (captures, its Activity page's bodies).
captureBuffer: 0
helpagent:
  disable: true
performance:
  disabled: true
# Gufo's own limit (--max-request-bytes), for conversations full of images.
maxRequestBodyMB: 64

upstream:
  # These paths of /upstream/<model>/ never start a model: a stopped one answers 409. The gateway's live view polls
  # the LLM's /slots this way. The first entry is llama-swap's default, kept.
  ignorePaths:
    - '.*\.(js|json|css|png|gif|jpg|jpeg|ico|txt)$'
    - '^/(?:slots|metrics|props|ready|health)$'

models:
  qwen3.8-flash-next:
    name: Qwen3.8 Flash-Next
    # The units are podman quadlets (gufo*.container); `start --wait` lasts as long as the unit runs.
    cmd: systemctl --user start --wait gufo.service
    cmdStop: systemctl --user stop gufo.service
    proxy: http://127.0.0.1:18080
    checkEndpoint: /ready
  # Ming's own code in PyTorch (llm-server/media/ming.service): Gufo does not run it.
  Ming-Image-0.2-Design:
    name: Ming-Image-0.2-Design (new images)
    cmd: systemctl --user start --wait ming.service
    cmdStop: systemctl --user stop ming.service
    proxy: http://127.0.0.1:18081
    checkEndpoint: /ready
  Qwen-Image-2.1-Turbo:
    name: Qwen-Image-2.1-Turbo (image edits and fast drafts)
    cmd: systemctl --user start --wait gufo-image-turbo.service
    cmdStop: systemctl --user stop gufo-image-turbo.service
    proxy: http://127.0.0.1:18082
    checkEndpoint: /ready
  # The media models (llm-server/media/ and the gufo-*.container quadlets), as llm-server/media.json names them.
  # The portal reaches video and music at /upstream/<id>/v1/... (MEDIA_MODEL_PATH): llama-swap routes no /v1/videos, nor
  # the portal's /v1/audio/music. Speech and transcriptions go to llama-swap's own /v1/audio routes, which pick the
  # model by the request's `model`.
  minimax-h3:
    name: MiniMax H3 (video with sound)
    cmd: systemctl --user start --wait gufo-video.service
    cmdStop: systemctl --user stop gufo-video.service
    proxy: http://127.0.0.1:18083
    checkEndpoint: /ready
  fish-drama-3:
    name: Fish Audio Drama 3 (speech)
    cmd: systemctl --user start --wait fish-speech.service
    cmdStop: systemctl --user stop fish-speech.service
    proxy: http://127.0.0.1:18084
    checkEndpoint: /ready
  sov-transcribe-1:
    name: SOV-Transcribe-1 (transcription)
    cmd: systemctl --user start --wait vllm-sov.service
    cmdStop: systemctl --user stop vllm-sov.service
    proxy: http://127.0.0.1:18085
    checkEndpoint: /health
  # Both XL models in one process: the request's model (base, or the turbo alias) picks one.
  acestep-1.5-xl-base:
    name: ACE-Step 1.5 XL (music)
    aliases: [acestep-1.5-xl-turbo]
    cmd: systemctl --user start --wait acestep.service
    cmdStop: systemctl --user stop acestep.service
    proxy: http://127.0.0.1:18086
    checkEndpoint: /ready
  # Everyday speech (Gufo's Qwen3-TTS and Qwen3-ASR), beside the LLM.
  qwen3-tts-1.7b:
    name: Qwen3-TTS 1.7B CustomVoice (speech)
    cmd: systemctl --user start --wait gufo-tts.service
    cmdStop: systemctl --user stop gufo-tts.service
    proxy: http://127.0.0.1:18087
    checkEndpoint: /ready
    ttl: 300
  qwen3-tts-1.7b-clone:
    name: Qwen3-TTS 1.7B Base (voice cloning)
    cmd: systemctl --user start --wait gufo-tts-clone.service
    cmdStop: systemctl --user stop gufo-tts-clone.service
    proxy: http://127.0.0.1:18088
    checkEndpoint: /ready
    ttl: 300
  qwen3-tts-1.7b-design:
    name: Qwen3-TTS 1.7B VoiceDesign (designed voices)
    cmd: systemctl --user start --wait gufo-tts-design.service
    cmdStop: systemctl --user stop gufo-tts-design.service
    proxy: http://127.0.0.1:18089
    checkEndpoint: /ready
    ttl: 300
  qwen3-asr-1.7b:
    name: Qwen3-ASR 1.7B (transcription)
    cmd: systemctl --user start --wait gufo-asr.service
    cmdStop: systemctl --user stop gufo-asr.service
    proxy: http://127.0.0.1:18090
    checkEndpoint: /ready
    ttl: 300
  # LTX-2.5 22B distilled, the fast video model (llm-server/media/ltx.service), once its weights are downloaded
  # (docs/GUIDE.md): uncomment it, add it to the `media` group and to llm-server/media.json's video.fast, and install
  # that with deploy/models.sh.
  # ltx-2.5-distilled:
  #   name: LTX-2.5 22B distilled (video with sound)
  #   cmd: systemctl --user start --wait ltx.service
  #   cmdStop: systemctl --user stop ltx.service
  #   proxy: http://127.0.0.1:18091
  #   checkEndpoint: /ready

routing:
  router:
    use: group
    settings:
      groups:
        llm:
          swap: true
          exclusive: true
          members: [qwen3.8-flash-next]
        # One image model at a time, though both would fit (53.6 and 35.2 GiB at most): an agent's calls go back to
        # the LLM between them, which stops every image model, so a second loaded one would save no swap.
        images:
          swap: true
          exclusive: true
          members: [Ming-Image-0.2-Design, Qwen-Image-2.1-Turbo]
        # One media model at a time, with nothing beside it but an everyday speech model: H3 holds up to 40 GiB while
        # it denoises, and vLLM takes the cache it is given (vllm-sov.container caps it so one speech model fits).
        media:
          swap: true
          exclusive: true
          members: [minimax-h3, fish-drama-3, sov-transcribe-1, acestep-1.5-xl-base]
        # The everyday speech models, one at a time beside the LLM: it keeps running, and a swap within the group
        # takes about 2.5 s. Two together leave under 12 GiB free (9.8 GiB measured) and three exceed the GPU's
        # eight compute queues (about 23 W more at idle). Persistent: without it any request to a model of an
        # exclusive group, the LLM's included (the portal reads its /slots twice a second), stops the speech model,
        # and every speech request starts it again. Each stops after five idle minutes instead (ttl).
        speech:
          swap: true
          exclusive: false
          persistent: true
          members: [qwen3-tts-1.7b, qwen3-tts-1.7b-clone, qwen3-tts-1.7b-design, qwen3-asr-1.7b]

hooks:
  on_startup:
    preload: [qwen3.8-flash-next]
