# The lockdown of DeepSeek Harness in a workspace. start-dsh applies it and then the gateway's portal.patch.yml
# (models, search, browser), both after the user's own patch, where the UI's settings land: these rows win, and the
# UI shows their plugins read-only. Top-level rows only: a patch replaces a row's whole config, so the preset rows
# that need what is off here are disabled in the shipped presets instead (dsh/adapt-presets.mjs).
# The image build fails unless every row applies to its dsh version (dsh/check-lockdown.sh). A row marked
# "# optional" is of a plugin some dsh versions no longer have, and may be missing.

# The cookie secret: start-dsh writes this file at every start, in a tmpfs.
- id: credentials
  config:
    path: /tmp/dsh-credentials.yaml

# No internet: the DeepSeek account, its LLM routes and its API's request extensions.
- id: deepseek-account
  disabled: true
- id: llm-deepseek-account
  disabled: true
- id: account-controller  # optional: gone since dsh 0.2.2-rc.3, where deepseek-account serves the account API
  disabled: true
- id: ui-settings-account
  disabled: true
- id: llm-deepseek
  disabled: true
- id: plugin-package-inventory-deepseek
  disabled: true

# No internet: the built-in web_fetch and web_search (the portal's MCP server searches).
- id: web
  disabled: true
- id: web-search-deepseek
  disabled: true
- id: web-deepseek-api
  disabled: true
- id: web-fetch-http
  disabled: true
- id: ui-settings-web-search
  disabled: true

# No internet: the plugin manager and market, which install from registries.
- id: plugin-manager
  disabled: true
- id: ui-plugin-manager
  disabled: true

# No internet: feedback upload. (DSH_TELEMETRY_DISABLED in the image removes telemetry.)
- id: message-feedback
  disabled: true
- id: ui-message-feedback
  disabled: true
- id: command-feedback
  disabled: true

# Desktop integrations, of which a container has none.
- id: open-in-app
  disabled: true
- id: ui-open-in-app
  disabled: true
# The sidebar browser, an iframe in the user's own browser: off by default, and here so no user patch turns it on.
- id: ui-sidebar-browser
  disabled: true

# One workspace, /workspace: dsh creates <documentsDirectory>/deepseek-harness/default-workspace at the first load,
# which the image ships as a link to it. No directory picker, and so no add-workspace button.
- id: workspace-controller
  config:
    documentsDirectory: /usr/local/lib/workspace-portal/dsh-documents
- id: directory-picker
  disabled: true

# The agent's bash runs under dsh's Landlock launcher. workspace-write lets it write /workspace, /tmp, /dev/null and
# the roots below without asking; anything else needs an approval. Fixed here, not from DSH_PERMISSION_MODE. A user
# can still switch one session's mode in the UI, and the UI's terminal is not confined.
# Of the home only the caches package managers write (start-dsh creates them): the rest holds what runs unconfined
# later (dsh's settings, where a user patch may carry !!js, skills and shell start-up files).
- id: sandbox-policy
  config:
    mode: workspace-write
    workspaceRoot: /workspace
    additionalWritableRoots: [/home/user/.cache, /home/user/.local, /home/user/.npm, /dev/shm]
- id: approval
  config:
    policy: ask
