# Workspace Portal: static dsh lockdown for DeepSeek Harness (web profile).
# Ships in the image at /usr/local/share/workspace-portal/dsh/lockdown.patch.yml. start-dsh applies it as
#   dsh --profile web --patch <this file> --patch /etc/workspace-portal/dsh/portal.patch.yml
# i.e. after the user's own $DSH_HOME/profiles/web/cordis.patch.yml (where UI settings land), so every row
# here wins over UI settings, and the UI shows these plugins read-only. portal.patch.yml (rendered by the
# gateway) adds the models, the search MCP server and the browser.
# Only top-level rows, by id. The agent presets' own plugin rows can't be patched one by one (a patch
# replaces a row's whole config), so the image build adapts the shipped preset files instead:
# dsh/adapt-presets.mjs disables the preset rows that need what this file turns off.
# The build checks every row here against the dsh version it installs (dsh/check-lockdown.sh) and fails if
# one doesn't apply, so a dsh update never ships a silently weaker lockdown. A row marked `# optional`
# disables a plugin that some supported dsh versions no longer have; only those may be missing.

# ── cookie secret: a fresh credentials file per start, written by start-dsh (tmpfs, never in $HOME) ──
- id: credentials
  config:
    path: /tmp/dsh-credentials.yaml

# ── no internet: DeepSeek account, DeepSeek LLM routes, DeepSeek-API request extensions ────────────
- id: deepseek-account
  disabled: true
- id: llm-deepseek-account
  disabled: true
- id: account-controller  # optional: gone since dsh 0.2.2-rc.3, where deepseek-account serves the account API
  disabled: true
- id: ui-settings-account
  disabled: true
- id: llm-deepseek
  disabled: true
- id: plugin-package-inventory-deepseek
  disabled: true

# ── no internet: built-in web_fetch / web_search (search is the portal's MCP server) ───────────────
# The presets' own tool-web rows, which need `web`, are disabled in the image (dsh/adapt-presets.mjs).
- id: web
  disabled: true
- id: web-search-deepseek
  disabled: true
- id: web-deepseek-api
  disabled: true
- id: web-fetch-http
  disabled: true
- id: ui-settings-web-search
  disabled: true

# ── no internet: plugin manager / market (npm and pnpm registry installs) ─────────────────────────
# Their preset tool rows are disabled in the image as well.
- id: plugin-manager
  disabled: true
- id: ui-plugin-manager
  disabled: true

# ── no internet: feedback upload (telemetry itself is removed by DSH_TELEMETRY_DISABLED=1 in the image) ─
- id: message-feedback
  disabled: true
- id: ui-message-feedback
  disabled: true
- id: command-feedback
  disabled: true

# ── host desktop integrations, meaningless in a container ───────────────────────────────────────────
- id: open-in-app
  disabled: true
- id: ui-open-in-app
  disabled: true
# Right-sidebar web browser: an iframe in the user's own browser (off by default in the web profile);
# keep it off so a user patch can't turn it on.
- id: ui-sidebar-browser
  disabled: true

# ── one workspace: /workspace ──────────────────────────────────────────────────────────────────────
# The first UI load creates <documentsDirectory>/deepseek-harness/default-workspace; the image ships that
# path as a root-owned symlink to /workspace and dsh records the resolved /workspace. No directory picker
# (that also removes the add-workspace button).
- id: workspace-controller
  config:
    documentsDirectory: /usr/local/lib/workspace-portal/dsh-documents
- id: directory-picker
  disabled: true

# ── commands: Landlock-confined bash with approval prompts ─────────────────────────────────────────
# The agent's bash tool runs under dsh's Landlock launcher (works under Docker's default seccomp with
# no-new-privileges). workspace-write lets its commands write the session workspace (/workspace), /tmp,
# /dev/null and the roots below without asking; anything else needs an approved escalation. Fixed here,
# not from DSH_PERMISSION_MODE. Users can still switch a single session's mode in the UI, and the UI's
# terminal (the person typing) is not confined.
# Of the home directory only the caches package managers write (start-dsh creates them): the rest holds
# what runs unconfined later, dsh's own settings in ~/.dsh (a user patch may carry `!!js`), skills in
# ~/.agents and shell start-up files, which a command must not change without an approval.
- id: sandbox-policy
  config:
    mode: workspace-write
    workspaceRoot: /workspace
    additionalWritableRoots: [/home/user/.cache, /home/user/.local, /home/user/.npm, /dev/shm]
- id: approval
  config:
    policy: ask
